pure_pursuit:
  ros__parameters:
    odom_topic: "/ego_racecar/odom"
    path_topic: "/Path"
    car_refFrame: "ego_racecar/base_link"
    global_refFrame: "map"
    drive_topic: "/drive"
    test_mode: False
    drive_test_topic: "/drive_test"
    rviz_current_waypoint_topic: "/current_waypoint"
    rviz_lookahead_waypoint_topic: "/lookahead_waypoint"
    rviz_speed_offset_waypoint_topic: "/speed_offset_waypoint"
    rviz_runtime_params_topic: "/pp_runtime_params"
    rviz_runtime_params_x: 0.0
    rviz_runtime_params_y: 0.0
    rviz_runtime_params_z: 1.2
    rf_topic: "/rf"
    rf_speed_scale_channel: 6
    rf_max_limit_channel: 7
    rf_enable_channel: 8
    # enable 채널 raw 값이 이 값 이상일 때만 반영 (sim raw range 0~1500의 중간값)
    rf_enable_threshold: 750
    rf_value_min: 0
    rf_value_max: 1500

    # VESC sensors/core 기반 실제 휠 속도
    # speed(m/s) = (state.speed[erpm] - speed_to_erpm_offset) / speed_to_erpm_gain
    vesc_state_topic: "sensors/core"
    speed_to_erpm_gain: 3172.47
    speed_to_erpm_offset: 0.0
    wheel_speed_deadband: 0.05  # 이하이면 0으로 간주 (vesc_to_odom과 동일)
    # 측정 휠 속도를 명령 속도(path speed) 도메인으로 맞추는 배율.
    # 실측이 약 2.6배 느리게 나와서 곱해줍니다. 아래 diff 값들은 모두
    # 이 변환 후의 명령 속도 기준입니다 (실제 속도로는 1/2.6 수준).
    wheel_speed_scale: 2.6
    wheel_speed_timeout: 0.5  # 이보다 오래된 값이면 런치 스타트를 걸지 않음

    # 런치 스타트: 트리거가 오면 목표 속도까지 설정 가속도로만 올라가는 래치
    launch_start_enabled: False  # sim에는 VESC가 없어 기본 비활성
    # /rf.data[] 인덱스 (앞에서 6번째 채널 = 0-based 5)
    launch_start_channel: 5
    launch_start_channel_threshold: 1800  # 이하 -> 초과로 올라갈 때만 발동
    launch_start_engage_diff: 1.0   # 목표와 휠 속도 차이가 이 이상일 때만 래치
    launch_start_release_diff: 0.5  # 목표와 차이가 이 이하가 되면 래치 해제
    launch_start_accel: 3.0         # m/s^2, 래치 중 속도 변화율
    launch_start_reset_topic: "/launch_start_reset"  # std_msgs/Bool

    # Pure Pursuit Parameters
    # Lookahead is computed using the following: lookahead = min(max(min_lookahead, max_lookahead * curr_velocity / lookahead_ratio), max_lookahead);
    min_lookahead: 0.5
    max_lookahead: 3.0 # lookahead when the car is going around max velocity
    lookahead_ratio: 8.0 # approximately the max velocity
    speed_profile_distance_offset: 0.0
    drive_output_rate_hz: 50.0
    publish_drive_on_odom: True
    visualization_rate_hz: 20.0
    steer_latest_blend: 0.10
    steer_large_change_blend: 0.55
    steer_blend_change_threshold_deg: 10.0
    steer_speed_filter_start_speed: 3.0
    steer_speed_filter_end_speed: 5.0
    steer_speed_filter_final_blend: 0.30
    speed_latest_blend: 0.90
    K_p: 0.5
    steering_limit: 25.0
    steering_expo_gain: 0.0
    steering_expo_curve: 2.0
    velocity_percentage: 1.0
    max_speed_limit_percentage: 1.0
    steer_reduction_speed_threshold: 5.0 # m/s
    steer_reduction_constant_coef: 0.85
    steer_reduction_linear_coef: 0.03
    steer_reduction_min_scale: 0.3
    speed_reduction_steer_angle_deg: 12.0
    max_allowed_steer_drop_deg: 5.0
    speed_reduction_adjust: 0.0
    speed_reduction_prev_scale: 0.0

waypoint_visualizer_node:
  ros__parameters:
    path_topic: "/Path"
    rviz_waypoints_topic: "/waypoints"
